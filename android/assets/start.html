<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Speed Dial</title>
<style>
:root{
  --bg:#000; --hover:#0d0d0d; --line:#434343; --line-2:#666; --line-3:#232323;
  --text:#fff; --dim:#999; --dim-2:#6f6f6f; --accent:#1d9bf0;
}
.search:focus-within{border-color:var(--accent)!important}
body[data-glass="1"] .tile{background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body[data-glass="1"] .search{background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tile,.search,.tile .g{border-radius:var(--radius,0)}
#form,#form input{border-radius:var(--radius,0)}
body[data-caps="off"] .h{text-transform:none;letter-spacing:normal}
body[data-geek="1"]{background:#000}
body[data-geek="1"] .tile,body[data-geek="1"] .search{background:rgba(0,20,6,.5);border-color:rgba(18,197,82,.3)}
body[data-geek="1"] .tile .g{border-color:rgba(18,197,82,.35)}
body[data-geek="1"]{font-family:'Consolas','DejaVu Sans Mono',monospace}
body[data-geek="1"] .lg,body[data-geek="1"] .clock b{color:#c9ffd6;text-shadow:0 0 8px rgba(18,197,82,.5)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:sans-serif;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:9vh 20px 40px}
.clock{font-size:14px;color:var(--dim);letter-spacing:.04em;margin-bottom:3.4vh;font-weight:500}
.clock b{color:var(--text);font-weight:700}
.lg{display:inline-flex;align-items:center;font-weight:800;font-size:40px;line-height:1;margin-bottom:4.5vh;letter-spacing:-.01em}
.lg svg{display:block;margin:0 -1px}
.search{width:100%;max-width:520px;height:46px;border:1px solid var(--line-2);display:flex;align-items:center;margin-bottom:5vh;background:var(--bg)}
.search svg{flex:0 0 auto;margin:0 12px 0 14px;opacity:.6}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:15px;height:100%;font-weight:500}
.search input::placeholder{color:var(--dim-2)}
.h{align-self:flex-start;width:100%;max-width:520px;margin:0 auto 10px;font-size:9.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--dim);font-weight:500}
.grid{width:100%;max-width:520px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:26px}
.tile{position:relative;border:1px solid var(--line);padding:16px 8px 13px;display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
.tile:active{background:var(--hover)}
.tile .g{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;border:1px solid var(--line-3)}
.tile .l{font-size:10.5px;font-weight:600;color:var(--dim);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .del{position:absolute;top:0;right:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--dim-2);font-size:13px}
#form{width:100%;max-width:520px;border:1px solid var(--line);padding:12px;display:none;flex-direction:column;gap:8px;margin:-16px 0 26px}
#form.open{display:flex}
#form input{background:none;border:1px solid var(--line-2);color:var(--text);font-size:13px;padding:10px;outline:0}
#form .r{display:flex;gap:8px;justify-content:flex-end}
#form button{padding:10px 18px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line-2);background:none;color:var(--text);font-family:inherit}
#form button.solid{background:var(--text);color:var(--bg);border-color:var(--text)}
.foot{margin-top:auto;padding-top:5vh;font-size:9.5px;color:var(--dim-2);text-align:center;line-height:1.7}
/* ---- foldable: adapt from the Galaxy Fold cover screen to the wide inner screen ---- */
@media (min-width:600px){
  body{padding-top:10vh}
  .lg{font-size:50px;margin-bottom:4vh}
  .search{max-width:640px;height:52px}
  .search input{font-size:16px}
  .h,#form{max-width:680px}
  .grid{max-width:680px;grid-template-columns:repeat(4,1fr);gap:11px}
  .tile{padding:20px 8px 16px}
  .tile .g{width:40px;height:40px;font-size:22px}
  .tile .l{font-size:11.5px}
  .foot{font-size:10.5px}
}
@media (min-width:820px){
  .search,.h,#form{max-width:780px}
  .grid{max-width:780px;grid-template-columns:repeat(5,1fr)}
}
@media (max-width:360px){
  .grid{gap:7px}
  .tile{padding:13px 6px 11px}
  .tile .l{font-size:10px}
}
</style>
</head>
<body>
<div class="clock" id="clock"></div>
<div class="lg">K<svg viewBox="-56 -56 112 112" width="31" height="31" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="7.4"><circle r="50"/><ellipse rx="18" ry="50"/><ellipse rx="36.5" ry="50"/><line y1="-50" y2="50"/><line x1="-48.7" y1="0" x2="48.7" y2="0"/><line x1="-43.6" y1="21.5" x2="43.6" y2="21.5"/><line x1="-43.6" y1="-21.5" x2="43.6" y2="-21.5"/><line x1="-31" y1="38" x2="31" y2="38"/><line x1="-31" y1="-38" x2="31" y2="-38"/></g></svg>NEKT</div>

<div class="search">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><path d="M15.5 15.5 21 21M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0"/></svg>
  <input id="q" autocomplete="off" spellcheck="false">
</div>

<div class="h">Speed Dial</div>
<div class="grid" id="grid"></div>

<div id="form">
  <input id="fu" placeholder="Address — e.g. konekt.network" spellcheck="false">
  <input id="ft" placeholder="Name (optional)" spellcheck="false">
  <div class="r"><button onclick="closeForm()">Cancel</button><button class="solid" onclick="addDial()">Add</button></div>
</div>

<div class="foot">© 2026 KONEKT · NKO INTL. FOUNDATION OF<br>TECHNOLOGICAL RESEARCH &amp; DEVELOPMENT</div>

<script>
'use strict';
var KONEKT_TILE = { host:'KONEKT', u:'https://konekt-tawny.vercel.app', mark:true };

/* ---- appearance from the app (mode / accent / wallpaper) ---- */
var WALLS = {
  none:'',
  aurora:'radial-gradient(120% 120% at 20% 0%, #10233b 0%, #0a0a12 45%, #000 100%)',
  ember:'radial-gradient(120% 120% at 0% 0%, #2a0f0f 0%, #0a0708 45%, #000 100%)',
  mono:'radial-gradient(120% 120% at 50% 0%, #1a1a1a 0%, #0a0a0a 50%, #000 100%)',
  teal:'radial-gradient(120% 120% at 15% 10%, #06272b 0%, #06131a 45%, #000 100%)',
  violet:'radial-gradient(120% 120% at 80% 0%, #1a1040 0%, #0a0816 45%, #000 100%)'
};
function h2r(h){ var m=/^#?([0-9a-f]{6})$/i.exec((h||'').trim()); if(!m) return null; var n=parseInt(m[1],16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function r2h(c){ return '#'+c.map(function(v){ return ('0'+Math.max(0,Math.min(255,Math.round(v))).toString(16)).slice(-2); }).join(''); }
function lum(h){ var c=h2r(h); return c?(0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255:0; }
function mixc(a,b,t){ var x=h2r(a),y=h2r(b); if(!x||!y) return a; return r2h([0,1,2].map(function(i){ return x[i]+(y[i]-x[i])*t; })); }
function applyAppearance(){
  var ap = {};
  try { if (window.KB && KB.appearance) ap = JSON.parse(KB.appearance()); } catch(e){}
  var r = document.documentElement.style, b = document.body;
  var mode = ap.mode || 'dark';
  var sysLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  var light = mode === 'light' || (mode === 'system' && sysLight);
  var glass = mode === 'glass';
  if (ap.accent) r.setProperty('--accent', ap.accent);
  if (mode === 'custom' && ap.bgCol){
    var bg = ap.bgCol, lightBase = lum(bg) > 0.5, ink = ap.textCol || (lightBase ? '#000' : '#fff');
    r.setProperty('--bg', bg); r.setProperty('--hover', mixc(bg, ink, 0.06)); r.setProperty('--text', ink);
    r.setProperty('--dim', mixc(ink, bg, 0.4)); r.setProperty('--dim-2', mixc(ink, bg, 0.6));
    var line = ap.lineCol || mixc(bg, ink, 0.28);
    r.setProperty('--line', line); r.setProperty('--line-2', mixc(line, ink, 0.35)); r.setProperty('--line-3', mixc(line, bg, 0.55));
  } else if (light){
    r.setProperty('--bg','#fff'); r.setProperty('--hover','#f3f3f3'); r.setProperty('--line','#c4c4c4');
    r.setProperty('--line-2','#8f8f8f'); r.setProperty('--line-3','#e2e2e2'); r.setProperty('--text','#000');
    r.setProperty('--dim','#666'); r.setProperty('--dim-2','#8a8a8a');
  }
  var fs = ap.fs || 'm'; b.style.zoom = fs === 's' ? '0.94' : fs === 'l' ? '1.09' : '1';
  var px = parseInt(ap.radius, 10) || 0; r.setProperty('--radius', px + 'px');
  if (ap.caps === false || ap.caps === 'off') b.setAttribute('data-caps','off');
  /* wallpaper: preset, custom image/gif, or looped video */
  var wp = ap.wallpaper || '', wall = '', vid = '';
  if (WALLS[wp] !== undefined) wall = WALLS[wp];
  else if (/^https?:.*\.(mp4|webm|ogv)(\?|#|$)/i.test(wp)) vid = wp;
  else if (/^(https?:|data:)/.test(wp)) wall = "url('" + wp.replace(/'/g, '%27') + "')";
  if (!wall && !vid && glass) wall = WALLS.aurora;
  if (wall){ b.style.backgroundImage = wall; b.style.backgroundSize = 'cover'; b.style.backgroundAttachment = 'fixed'; }
  var vEl = document.getElementById('wallVid');
  if (vid){ if(!vEl){ vEl=document.createElement('video'); vEl.id='wallVid'; vEl.muted=true; vEl.loop=true; vEl.autoplay=true; vEl.setAttribute('playsinline',''); vEl.style.cssText='position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2'; document.body.appendChild(vEl); } if(vEl.getAttribute('src')!==vid){ vEl.setAttribute('src',vid); var pp=vEl.play(); if(pp)pp.catch(function(){}); } }
  else if (vEl) vEl.remove();
  if (glass){ b.setAttribute('data-glass','1'); }
  /* Geek effect — cmatrix + typed line */
  if (mode === 'geek'){ if(!ap.accent) r.setProperty('--accent','#12c552'); r.setProperty('--text','#c9ffd6'); r.setProperty('--dim','#4be08a'); b.setAttribute('data-geek','1'); startMatrix(); geekType(); }
  else { b.removeAttribute('data-geek'); var mc=document.getElementById('mtx'); if(mc)mc.remove(); if(window._mtxRAF){cancelAnimationFrame(window._mtxRAF);window._mtxRAF=null;} }
}
function startMatrix(){
  var c = document.getElementById('mtx');
  if(!c){ c=document.createElement('canvas'); c.id='mtx'; c.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none'; document.body.appendChild(c); }
  var ctx=c.getContext('2d'), chars='アイウエオカキクケコサシスセソ0123456789<>[]{}/=+*$#@'.split(''), W,H,cols,drops,last=0;
  function rs(){ W=c.width=window.innerWidth; H=c.height=window.innerHeight; cols=Math.ceil(W/14); drops=[]; for(var i=0;i<cols;i++)drops[i]=Math.random()*-40; }
  rs(); if(!c._rz){ c._rz=1; window.addEventListener('resize',rs); }
  function fr(t){ if(document.body.getAttribute('data-geek')!=='1'||!document.body.contains(c)){window._mtxRAF=null;return;}
    if(t-last>55){ last=t; ctx.fillStyle='rgba(0,8,2,0.09)'; ctx.fillRect(0,0,W,H); ctx.font='13px monospace';
      for(var i=0;i<cols;i++){ var ch=chars[Math.floor(Math.random()*chars.length)], x=i*14, y=drops[i]*16;
        ctx.fillStyle=Math.random()>0.97?'#d7ffe3':'#12c552'; ctx.fillText(ch,x,y);
        if(y>H&&Math.random()>0.975)drops[i]=Math.random()*-20; else drops[i]++; } }
    window._mtxRAF=requestAnimationFrame(fr); }
  if(window._mtxRAF)cancelAnimationFrame(window._mtxRAF); window._mtxRAF=requestAnimationFrame(fr);
}
function geekType(){
  var lg=document.querySelector('.lg'); if(!lg||document.getElementById('geekLine'))return;
  var line=document.createElement('div'); line.id='geekLine'; line.style.cssText='font-family:monospace;color:#12c552;font-size:12px;text-shadow:0 0 6px rgba(18,197,82,.6);margin:-2vh 0 3vh';
  lg.parentNode.insertBefore(line, lg.nextSibling);
  var txt='> KONEKT://browser — access granted_', i=0;
  (function step(){ if(!document.body.contains(line))return; line.textContent=txt.slice(0,i)+(i<txt.length?'▋':''); if(i<=txt.length){i++;setTimeout(step,45);} })();
}
applyAppearance();

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function globe(px){
  return '<svg viewBox="-56 -56 112 112" width="'+px+'" height="'+px+'"><g fill="none" stroke="currentColor" stroke-width="7.4">'+
    '<circle r="50"/><ellipse rx="18" ry="50"/><ellipse rx="36.5" ry="50"/><line y1="-50" y2="50"/>'+
    '<line x1="-48.7" y1="0" x2="48.7" y2="0"/><line x1="-43.6" y1="21.5" x2="43.6" y2="21.5"/>'+
    '<line x1="-43.6" y1="-21.5" x2="43.6" y2="-21.5"/></g></svg>';
}

function clock(){
  var d = new Date();
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('clock').innerHTML = '<b>' +
    ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2) + '</b> · ' +
    days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
}
clock(); setInterval(clock, 15000);

function bridge(fn, arg1, arg2){
  try {
    if (!window.KB) return null;
    if (fn === 'dials') return JSON.parse(KB.dials());
    if (fn === 'top') return JSON.parse(KB.topSites());
    if (fn === 'engine') return KB.engineName();
    if (fn === 'go') return KB.go(arg1);
    if (fn === 'add') return KB.addDial(arg1, arg2);
    if (fn === 'del') return KB.delDial(arg1);
  } catch (e) {}
  return null;
}

var q = document.getElementById('q');
q.placeholder = 'Search ' + (bridge('engine') || 'the web') + ' or enter address';
q.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && q.value.trim()) bridge('go', q.value.trim());
});

function render(){
  var dials = bridge('dials') || [];
  var top = bridge('top') || [];
  var tiles = [];
  for (var i = 0; i < dials.length; i++)
    tiles.push({ host: dials[i].t || dials[i].u, u: dials[i].u, del: dials[i].u });
  tiles.push(KONEKT_TILE);
  var cap = window.innerWidth >= 600 ? 12 : 8;   // wider inner screen fits more
  for (var j = 0; j < top.length && tiles.length < cap; j++)
    tiles.push({ host: top[j].host, u: top[j].u });

  var html = '';
  for (var k = 0; k < tiles.length; k++) {
    var s = tiles[k];
    html += '<div class="tile" data-go="'+esc(s.u)+'"><span class="g">'+
      (s.mark ? globe(24) : esc(String(s.host).charAt(0).toUpperCase() || '·'))+
      '</span><span class="l">'+esc(s.host)+'</span>'+
      (s.del ? '<span class="del" data-del="'+esc(s.del)+'">✕</span>' : '')+
      '</div>';
  }
  html += '<div class="tile" id="addTile"><span class="g">+</span><span class="l">Add site</span></div>';
  document.getElementById('grid').innerHTML = html;
}
render();

document.getElementById('grid').addEventListener('click', function(e){
  var del = e.target.closest('[data-del]');
  if (del){ bridge('del', del.getAttribute('data-del')); render(); return; }
  if (e.target.closest('#addTile')){
    document.getElementById('form').className = 'open';
    document.getElementById('fu').focus();
    return;
  }
  var go = e.target.closest('[data-go]');
  if (go) bridge('go', go.getAttribute('data-go'));
});

/* re-fill the grid when the device folds/unfolds (width crosses a breakpoint) */
var _rz;
window.addEventListener('resize', function(){
  clearTimeout(_rz);
  _rz = setTimeout(function(){ if (document.getElementById('form').className !== 'open') render(); }, 220);
});

function closeForm(){ document.getElementById('form').className = ''; }
function addDial(){
  var u = document.getElementById('fu').value.trim();
  if (!u) return;
  bridge('add', u, document.getElementById('ft').value.trim());
  document.getElementById('fu').value = ''; document.getElementById('ft').value = '';
  closeForm(); render();
}
</script>
</body>
</html>
