function wireBoardDnD(){
  const board = $('#hudBoard'); if (!board) return;
  const cw = () => (board.clientWidth / HUD_COLS);
  let drag = null;
  board.addEventListener('pointerdown', e => {
    if (e.target.closest('button[data-refresh],button[data-hudrm]')) return;   // let clicks through
    const card = e.target.closest('.hud-card'); if (!card) return;
    const rz = e.target.closest('[data-rz]'), handle = e.target.closest('.hud-drag');
    const br = board.getBoundingClientRect();
    if (rz) drag = { mode:'rz', card, id:card.dataset.widget };
    else if (handle){ const r = card.getBoundingClientRect(); drag = { mode:'mv', card, id:card.dataset.widget, ox:e.clientX-r.left, oy:e.clientY-r.top }; }
    else return;
    drag.br = br; card.classList.add('dragging'); card.setPointerCapture(e.pointerId); e.preventDefault();
  });
  board.addEventListener('pointermove', e => {
    if (!drag) return; const c = cw(), card = drag.card;
    if (drag.mode === 'mv'){
      const px = e.clientX - drag.br.left - drag.ox, py = e.clientY - drag.br.top - drag.oy;
      card.style.left = px+'px'; card.style.top = py+'px';
      drag._x = Math.max(0, Math.min(HUD_COLS-(+card.dataset.w), Math.round(px/c)));
      drag._y = Math.max(0, Math.round(py/hudRowH()));
    } else {
      const w = Math.max(1, Math.min(HUD_COLS-(+card.dataset.x), Math.round((e.clientX-drag.br.left-card.offsetLeft)/c)));
      const h = Math.max(1, Math.round((e.clientY-drag.br.top-card.offsetTop)/hudRowH()));
      card.style.width = (w*c-HUD_GAP)+'px'; card.style.height = (h*hudRowH()-HUD_GAP)+'px'; drag._w = w; drag._h = h;
    }
  });
  const done = () => {
    if (!drag) return; const card = drag.card, id = drag.id; card.classList.remove('dragging');
    const L = Object.assign({}, hudLayout()[id] || {x:0,y:0,w:2,h:2});
    if (drag.mode === 'mv'){ if (drag._x!=null) L.x=drag._x; if (drag._y!=null) L.y=drag._y; card.dataset.x=L.x; card.dataset.y=L.y; }
    else { if (drag._w) L.w=drag._w; if (drag._h) L.h=drag._h; card.dataset.w=L.w; card.dataset.h=L.h; }
    settings.hudLayout = Object.assign({}, settings.hudLayout || {}, { [id]: L }); saveSettings();
    drag = null; layoutBoard();
  };
  board.addEventListener('pointerup', done);
  board.addEventListener('pointercancel', done);
}

/* ==================== RGB / HSV colour wheel ==================== */
function hsv2rgb(h,s,v){
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c; let r,g,b;

const addr = $('#addr');
let sugItems = [], sugHot = -1;
function buildSug(q){
  q = q.trim().toLowerCase();
  sugItems = [];
  if (q){
    const seen = new Set();
    for (let i = history.length - 1; i >= 0 && sugItems.length < 6; i--){
      const h = history[i];
      if (seen.has(h.u)) continue;
      if (h.u.toLowerCase().includes(q) || (h.t || '').toLowerCase().includes(q)){
        seen.add(h.u); sugItems.push({ kind:'hist', u:h.u, t:h.t });
      }
    }
    sugItems.push({ kind:'search', u:searchURL(q), t:q });
  }
  sugHot = -1;
  const el = $('#sug');
  if (!sugItems.length){ el.classList.remove('open'); el.innerHTML=''; return; }
  el.innerHTML = sugItems.map((s, i) =>
    '<div class="sug" data-sug="'+i+'"><span class="si">'+(s.kind==='search'?ic('search',13):ic('hist',13))+'</span>'

}

function dayLabel(ts){
  const d = new Date(ts), now = new Date();
  const day = x => Math.floor((x - new Date(x).getTimezoneOffset()*60000) / 86400000);
  const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const nn = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((nn - dd) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
}
function renderHist(){
  const q = ($('#histQ').value || '').toLowerCase();
  const items = history.slice().reverse().filter(h => !q || h.u.toLowerCase().includes(q) || (h.t||'').toLowerCase().includes(q)).slice(0, 400);
  if (!items.length){ $('#histBody').innerHTML = '<div class="p-empty">Nothing here yet</div>'; return; }
  let out = '', lastDay = '';
  for (const h of items){
    const dl = dayLabel(h.ts);
    if (dl !== lastDay){ out += '<div class="p-day">'+dl+'</div>'; lastDay = dl; }
    out += '<div class="p-row" data-go="'+esc(h.u)+'" title="'+esc(h.u)+'">'

      + '<button class="rx" data-del="'+esc(h.u)+'|'+h.ts+'">'+ic('x',11)+'</button></div>';
  }
  $('#histBody').innerHTML = out;
}

/* downloads */
const dls = new Map();
function fmtSize(n){
  if (!n && n !== 0) return '?';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(2) + ' GB';
}
function renderDl(){
  const items = [...dls.values()].sort((a,b) => b.ts - a.ts);
  $('#bDl').innerHTML = ic('dl',16) + (items.some(d => d.state === 'progress' || d.state === 'started')
    ? '<span class="badge">'+items.filter(d => d.state==='progress'||d.state==='started').length+'</span>' : '');
  if (!$('#pDl').classList.contains('open')) return;
  if (!items.length){ $('#dlBody').innerHTML = '<div class="p-empty">No downloads yet</div>'; return; }
  $('#dlBody').innerHTML = items.map(d => {
    const pct = d.total ? Math.round(d.received / d.total * 100) : (d.state === 'completed' ? 100 : 0);
    const stat = d.state === 'completed' ? fmtSize(d.total || d.received)
      : d.state === 'cancelled' ? 'Cancelled'
      : d.state === 'interrupted' ? 'Failed'
      : d.paused ? 'Paused — ' + fmtSize(d.received) + ' of ' + fmtSize(d.total)
      : fmtSize(d.received) + ' of ' + fmtSize(d.total);
    const acts = d.state === 'completed'
      ? '<button class="da" data-dact="open|'+d.id+'">Open</button><button class="da" data-dact="show|'+d.id+'">Show in folder</button>'
      : (d.state === 'progress' || d.state === 'started')
      ? (d.paused ? '<button class="da" data-dact="resume|'+d.id+'">Resume</button>' : '<button class="da" data-dact="pause|'+d.id+'">Pause</button>')
        + '<button class="da" data-dact="cancel|'+d.id+'">Cancel</button>'
      : '';
    return '<div class="dl'+(d.state==='completed'?' done':'')+'"><div class="dn" title="'+esc(d.path||'')+'">'+esc(d.filename)+'</div>'
      + '<div class="ds">'+stat+'</div>'
      + '<div class="dbar"><i style="width:'+pct+'%"></i></div>'
      + (acts ? '<div class="dact">'+acts+'</div>' : '') + '</div>';
  }).join('');
}
$('#dlClear').onclick = () => {
  for (const [id, d] of [...dls]) if (d.state !== 'progress' && d.state !== 'started') dls.delete(id);
  renderDl();
};
$('#dlBody').addEventListener('click', e => {

function setZoom(t, z){
  t.zoom = Math.max(ZOOMS[0], Math.min(ZOOMS[ZOOMS.length-1], z));
  if (t.wv && t.ready) try { t.wv.setZoomFactor(t.zoom); } catch {}
  const el = $('#mZoomV'); if (el) el.textContent = Math.round(t.zoom * 100) + '%';
  if (Math.abs(t.zoom - 1) > .001) toast('Zoom ' + Math.round(t.zoom * 100) + '%');
}
function zoomStep(dir){
  const t = AT(); if (!t) return;
  let i = ZOOMS.findIndex(z => Math.abs(z - t.zoom) < .001);
  if (i < 0) i = ZOOMS.findIndex(z => z > t.zoom) - (dir > 0 ? 1 : 0);
  i = Math.max(0, Math.min(ZOOMS.length - 1, (i < 0 ? 7 : i) + dir));
  setZoom(t, ZOOMS[i]);
}

/* ---- reader mode: extract the article, sanitize, render a clean view ---- */
const READER_EXTRACT = "(function(){"
  + "function sc(el){var s=0;el.querySelectorAll('p,li,blockquote').forEach(function(p){var t=(p.innerText||'').trim();if(t.length>25)s+=t.length;});return s;}"
  + "var best=document.body,bs=0;"
  + "document.querySelectorAll('article,main,[role=main],.post,.article,.entry,.entry-content,.article-body,.article__body,.story-body,.postArticle,.content,#content,.markdown-body,.mw-parser-output').forEach(function(el){var s=sc(el);if(s>bs){bs=s;best=el;}});"
  + "if(bs<200){document.querySelectorAll('section,div').forEach(function(el){var s=sc(el);if(s>bs){bs=s;best=el;}});}"
  + "var mt=document.querySelector('meta[property=\"og:title\"]');"
  + "var title=(mt&&mt.content)||(document.querySelector('h1')&&document.querySelector('h1').innerText)||document.title||'';"
  + "var au=document.querySelector('meta[name=author]');var abody=document.querySelector('[rel=author],.author,.byline,.byline__name');"
  + "var byline=(au&&au.content)||(abody&&abody.innerText)||'';"
  + "var clone=best.cloneNode(true);"
  + "clone.querySelectorAll('script,style,noscript,nav,aside,form,button,iframe,svg,header,footer,[aria-hidden=true],[role=navigation],[class*=share],[class*=social],[class*=related],[class*=recirc],[class*=promo],[class*=newsletter],[class*=comment],[class*=advert],[id*=comment],figcaption').forEach(function(n){n.remove();});"
  + "return {title:title,byline:byline,html:clone.innerHTML,url:location.href,chars:(clone.innerText||'').trim().length};"
  + "})()";
function openReader(){
  const t = AT();
  if (!t || !t.wv || !t.ready || !/^https?:/.test(t.url||'')){ toast('Nothing to read here'); return; }
  t.wv.executeJavaScript(READER_EXTRACT, false).then(res => {
    if (!res || (res.chars||0) < 200){ toast('No readable article found'); return; }
    renderReader(res);
  }).catch(() => toast('Reader failed'));
}
function sanitizeReader(html, baseUrl){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,link,meta,iframe,object,embed,form,input,button,svg,video,audio').forEach(n => n.remove());
  const allow = new Set(['P','H1','H2','H3','H4','H5','H6','UL','OL','LI','BLOCKQUOTE','PRE','CODE','EM','STRONG','B','I','U','A','IMG','FIGURE','FIGCAPTION','BR','HR','SPAN','DIV','TABLE','THEAD','TBODY','TR','TD','TH','MARK','SUP','SUB']);
  doc.body.querySelectorAll('*').forEach(el => {
    if (!allow.has(el.tagName)){ el.replaceWith(...el.childNodes); return; }
    [...el.attributes].forEach(a => { const n = a.name.toLowerCase();
      if (n === 'href' || n === 'src'){ try { const abs = new URL(a.value, baseUrl).href; if (/^javascript:/i.test(abs)) el.removeAttribute(a.name); else el.setAttribute(a.name, abs); } catch { el.removeAttribute(a.name); } }
      else if (n !== 'alt' && n !== 'title') el.removeAttribute(a.name);
    });
    if (el.tagName === 'A') el.setAttribute('data-rlink', '1');
  });
  return doc.body.innerHTML;
}

  $('#main').appendChild(ov);

function openCmdK(){
  if ($('#cmdk')) return;
  const ov = document.createElement('div'); ov.id = 'cmdk'; ov.className = 'cmdk-shade';
  ov.innerHTML = '<div class="cmdk"><div class="cmdk-in"><span class="cmdk-i"></span>'
    + '<input id="cmdkIn" placeholder="Search tabs, bookmarks, history — or a command…" spellcheck="false" autocomplete="off"></div>'
    + '<div class="cmdk-list" id="cmdkList"></div></div>';
  $('#main').appendChild(ov);
  ov.querySelector('.cmdk-i').innerHTML = ic('search', 15);
  const input = $('#cmdkIn'), list = $('#cmdkList');
  let items = [], hot = 0;
  const COMMANDS = [
    { t:'New tab', s:'Ctrl+T', run:()=>newTab(START) },
    { t:'Reopen closed tab', s:'Ctrl+Shift+T', run:reopenClosed },
    { t:'Speed Dial / HUD', run:()=>navigate(AT(), START) },
    { t:'Bookmark this page', s:'Ctrl+D', run:toggleBookmark },
    { t:'Add to reading list', run:addReadingList },
    { t:'Reading list', run:openReadingList },
    { t:'Bookmarks', run:()=>togglePanel('pBm') },
    { t:'History', s:'Ctrl+H', run:()=>togglePanel('pHist') },
    { t:'Downloads', s:'Ctrl+J', run:()=>togglePanel('pDl') },
    { t:'Capture screenshot', run:screenshotPage },
    { t:'Translate page', run:translatePage },
    { t:'Copy link', run:copyLink },
    { t:'Find in page', s:'Ctrl+F', run:openFind },
    { t:'Pop out video', run:pipVideo },
    { t:'KONEKT panel', run:()=>kpanelToggle() },
    { t:'Toggle bookmarks bar', s:'Ctrl+Shift+B', run:toggleBookmarksBar },
    { t:'Settings', run:openSettings },
    { t:'Account', run:openAccount },
    { t:'Check for updates', run:()=>{ openSettings(); setTimeout(checkUpdates, 200); } }
  ];
  function build(q){
    q = q.trim().toLowerCase(); const out = [];
    if (q) out.push({ kind:'Open', t:input.value, sub:'Search or go to', run:()=>navigate(AT(), input.value) });
    tabs.forEach(tb => { const label = tb.title || 'New tab', u = tb.url || '';
      if (!q || label.toLowerCase().includes(q) || u.toLowerCase().includes(q))
        out.push({ kind:'Tab', t:label, sub:(u===START?'Speed Dial':u), run:()=>activate(tb.id) }); });
    COMMANDS.forEach(c => { if (!q || c.t.toLowerCase().includes(q)) out.push({ kind:'Command', t:c.t, sub:c.s||'', run:c.run }); });
    if (q){ bookmarks.forEach(b => { if ((b.t||'').toLowerCase().includes(q) || (b.u||'').toLowerCase().includes(q))
        out.push({ kind:'Bookmark', t:b.t||b.u, sub:b.u, run:()=>navigate(AT(), b.u) }); }); }
    if (q){ const seen = new Set();
      for (let i = history.length-1; i>=0 && out.length<45; i--){ const h = history[i]; if (seen.has(h.u)) continue;
        if ((h.t||'').toLowerCase().includes(q) || h.u.toLowerCase().includes(q)){ seen.add(h.u); out.push({ kind:'History', t:h.t||h.u, sub:h.u, run:()=>navigate(AT(), h.u) }); } } }
    items = out.slice(0, 45); hot = 0; paint();
  }
  function paint(){
    list.innerHTML = items.map((it,i)=>'<div class="cmdk-row'+(i===hot?' hot':'')+'" data-i="'+i+'">'
      + '<span class="cmdk-k">'+esc(it.kind)+'</span><span class="cmdk-t">'+esc(it.t)+'</span><span class="cmdk-s">'+esc(it.sub||'')+'</span></div>').join('')
      || '<div class="cmdk-empty">No matches</div>';
    const h = list.querySelector('.hot'); if (h) h.scrollIntoView({ block:'nearest' });
  }
  function run(i){ const it = items[i]; if (!it) return; close(); try { it.run(); } catch {} }
  function close(){ ov.remove(); }
  input.addEventListener('input', () => build(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown'){ e.preventDefault(); hot = Math.min(items.length-1, hot+1); paint(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); hot = Math.max(0, hot-1); paint(); }
    else if (e.key === 'Enter'){ e.preventDefault(); run(hot); }
    else if (e.key === 'Escape'){ close(); }
  });
  list.addEventListener('click', e => { const r = e.target.closest('[data-i]'); if (r) run(+r.dataset.i); });
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  build(''); input.focus();
}

/* colour maths — a custom background derives the greys so they stay legible */
function hex2rgb(h){ const m = /^#?([0-9a-f]{6})$/i.exec(String(h||'').trim()); if(!m) return null; const n = parseInt(m[1],16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgb2hex(c){ return '#'+c.map(v => ('0'+Math.max(0,Math.min(255,Math.round(v))).toString(16)).slice(-2)).join(''); }
function luma(h){ const c = hex2rgb(h); return c ? (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255 : 0; }
function mixHex(a,b,t){ const x=hex2rgb(a), y=hex2rgb(b); if(!x||!y) return a; return rgb2hex([0,1,2].map(i => x[i]+(y[i]-x[i])*t)); }
function prefersLight(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches; }

function applyTheme(){
  const r = document.documentElement, S = r.style;
  const mode = settings.mode || 'dark';
  ['--bg','--hover','--hover-2','--line','--line-2','--line-3','--text','--accent'].forEach(k => S.removeProperty(k));

  let base;   // which built-in palette the greys follow
  if (mode === 'custom'){
    const bgc = settings.bgCol, ink = settings.textCol || (bgc && luma(bgc) > .5 ? '#000000' : '#ffffff');
    base = bgc ? (luma(bgc) > .5 ? 'light' : 'dark') : (prefersLight() ? 'light' : 'dark');
    if (bgc){ S.setProperty('--bg', bgc); S.setProperty('--hover', mixHex(bgc, ink, .06)); S.setProperty('--hover-2', mixHex(bgc, ink, .12)); }
    if (settings.lineCol){ S.setProperty('--line', settings.lineCol); S.setProperty('--line-2', mixHex(settings.lineCol, ink, .35)); S.setProperty('--line-3', mixHex(settings.lineCol, bgc || (base==='light'?'#ffffff':'#0a0b0d'), .55)); }
    if (settings.textCol) S.setProperty('--text', settings.textCol);
  } else if (mode === 'system'){
    base = prefersLight() ? 'light' : 'dark';
  } else {
    base = mode === 'light' ? 'light' : 'dark';   // dark | glass both use the dark palette
  }
  r.dataset.theme = base;
  r.dataset.appearance = mode;                 // dark | light | system | glass | custom | geek
  S.setProperty('--accent', mode === 'geek'
    ? (settings.accent && settings.accent.toLowerCase() !== '#1d9bf0' ? settings.accent : '#12c552')
    : (settings.accent || '#1d9bf0'));

  r.dataset.density = settings.density || 'cozy';
  r.dataset.fs = settings.fs || 'm';
  r.dataset.caps = settings.caps === false ? 'off' : 'on';
  r.dataset.motion = settings.motion === false ? 'off' : 'on';
  r.dataset.round = settings.avRound ? 'full' : 'square';
  S.setProperty('--radius', (Math.max(0, Math.min(24, parseInt(settings.radius,10)||0))) + 'px');

  /* wallpaper: an explicit preset, or a default for glass so the frost has
     something to refract */
  const wp = settings.wallpaper;
  let wall = '', video = '';
  if (wp){
    if (WALLS[wp] !== undefined) wall = WALLS[wp];
    else if (/^(https?:).*\.(mp4|webm|ogv)(\?|#|$)/i.test(wp)) video = wp;
    else if (/^(https?:|data:|blob:)/.test(wp)) wall = "url('" + wp.replace(/'/g, "%27") + "')";
    else if (/url\(|gradient|#/.test(wp)) wall = wp;
  }
  if (!wall && !video && (mode === 'glass')) wall = WALLS.aurora;
  S.setProperty('--wall', wall || 'none');
  r.dataset.wallOn = wall ? '1' : '0';
  r.dataset.wallVideo = video || '';

  settings.theme = base;                        // keep the legacy flag in step
  bridge.send('set-theme', { dark: base !== 'light' });
  bridge.send('set-material', { glass: mode === 'glass' });
  if (typeof syncStartFx === 'function') syncStartFx();   // matrix / video layers
}

/* ---------------------- chords ---------------------- */
function chord(c){
  const t = AT();
  switch (c){
    case 'ctrl+t': newTab(START); break;
    case 'ctrl+w': if (t) closeTab(t.id); break;
    case 'ctrl+shift+t': reopenClosed(); break;
    case 'ctrl+tab': cycle(1); break;
    case 'ctrl+shift+tab': cycle(-1); break;
    case 'ctrl+l': case 'f6': addr.focus(); break;
    case 'ctrl+f': openFind(); break;
    case 'ctrl+h': togglePanel('pHist'); break;
    case 'ctrl+j': togglePanel('pDl'); break;
    case 'ctrl+d': toggleBookmark(); break;
    case 'ctrl+k': openCmdK(); break;
    case 'ctrl+\\': toggleSplit(); break;
    case 'ctrl+shift+b': toggleBookmarksBar(); break;
    case 'ctrl+p': if (t && t.wv && t.ready) try { t.wv.print(); } catch {} break;
    case 'ctrl+r': case 'f5': if (t && t.wv) try { t.wv.reload(); } catch {} break;
    case 'ctrl+shift+r': if (t && t.wv) try { t.wv.reloadIgnoringCache(); } catch {} break;
    case 'f11': bridge.send('win-fullscreen'); break;
    case 'f12': if (t && t.wv && t.ready) try { t.wv.openDevTools(); } catch {} break;
    case 'ctrl+0': if (t) setZoom(t, 1); break;
    case 'ctrl+=': case 'ctrl+plus': zoomStep(1); break;
    case 'ctrl+-': zoomStep(-1); break;
    case 'alt+left': if (t && t.wv) try { t.wv.goBack(); } catch {} break;
    case 'alt+right': if (t && t.wv) try { t.wv.goForward(); } catch {} break;
    case 'escape':
      if ($('#wsPop')) closeWsPop();
      else if ($('#reader')) closeReader();
      else if ($('#cmdk')) $('#cmdk').remove();
      else if ($('#findbar').classList.contains('open')) closeFind();
      else if ($('#drawer').classList.contains('open')) closeDrawer();
      else if ($('#menu').classList.contains('open')) $('#menu').classList.remove('open');
      else if ($('#acctShade').classList.contains('open')) closeAccount();
      else if ($('#shade').classList.contains('open')) $('#shade').classList.remove('open');
      else document.querySelectorAll('.panel.open').forEach(p => p.classList.remove('open'));
      break;
    default:
      if (/^ctrl\+[1-9]$/.test(c)){
        const n = +c.slice(5), list = wsTabs();
        const target = n === 9 ? list[list.length - 1] : list[n - 1];
        if (target) activate(target.id);
      }
  }
}
function cycle(d){
  const list = wsTabs();
  if (list.length < 2) return;
  const i = list.findIndex(t => t.id === activeId);
  activate(list[(i + d + list.length) % list.length].id);
}
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  let c = '';
  if (e.ctrlKey) c += 'ctrl+';
  if (e.altKey) c += 'alt+';
  if (e.shiftKey && (k === 'tab' || k === 'r' || k === 't' || k === 'b')) c += 'shift+';
  c += k === '+' ? 'plus' : k === 'arrowleft' ? 'left' : k === 'arrowright' ? 'right' : k;
  const CH = new Set(['ctrl+t','ctrl+w','ctrl+shift+t','ctrl+tab','ctrl+shift+tab','ctrl+l','ctrl+f','ctrl+h',
    'ctrl+j','ctrl+d','ctrl+k','ctrl+\\','ctrl+shift+b','ctrl+p','ctrl+r','ctrl+shift+r','f5','f6','f11','f12','ctrl+0','ctrl+-','ctrl+=','ctrl+plus',
    'ctrl+1','ctrl+2','ctrl+3','ctrl+4','ctrl+5','ctrl+6','ctrl+7','ctrl+8','ctrl+9','escape']);
  const editing = /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName || '');
  if (c === 'escape' && editing && document.activeElement !== findQ){ return; }
  if (!CH.has(c)) return;
  if (editing && (c === 'ctrl+d')) {} // allow bookmark even while typing
  e.preventDefault();
  chord(c);
});

/* ================================================================
   ACCOUNTS + SYNC — the browser's own KONEKT account. Stores your
   bookmarks, history, speed-dials, settings and appearance on the
   server so a second device signs in and sees the same thing. The
   backend is the konekt-browser Vercel deployment (same design and
   Redis as konekt-tawny); auth is a bearer token kept locally.
   ================================================================ */
const API_BASE = 'https://konekt-browser.vercel.app';
let account = load('kb.account', null);      // { handle, name, token }
let syncVer = load('kb.syncver', 0);
let authTab = 'login';

async function kbApi(path, opts){
  opts = opts || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (account && account.token) headers['Authorization'] = 'Bearer ' + account.token;
  const r = await fetch(API_BASE + path, {
    method: opts.method || 'GET', headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

/* ---- the blob we sync ---- */
function collectData(){
  return {
    bookmarks: bookmarks,
    history: history.slice(-1200),
    dials: dials,
    readingList: readingList,
    settings: { engine: settings.engine, restore: settings.restore, adblock: settings.adblock, homepage: settings.homepage },
    appearance: { mode: settings.mode, accent: settings.accent, wallpaper: settings.wallpaper, density: settings.density,
                  fs: settings.fs, caps: settings.caps, radius: settings.radius, avRound: settings.avRound,
                  motion: settings.motion, bgCol: settings.bgCol, lineCol: settings.lineCol, textCol: settings.textCol },
    hud: { widgets: settings.hud, layout: settings.hudLayout, style: settings.hudStyle, row: settings.hudRow, loc: settings.hudLoc, markets: settings.markets, notes: settings.notes }
  };
}
function mergeIn(d){
  if (!d || typeof d !== 'object') return;
  if (Array.isArray(d.bookmarks)){
    const seen = new Set(bookmarks.map(b => b.u));
    d.bookmarks.forEach(b => { if (b && b.u && !seen.has(b.u)){ bookmarks.push(b); seen.add(b.u); } });
    save('kb.bookmarks', bookmarks);
  }
  if (Array.isArray(d.dials)){
    const seen = new Set(dials.map(x => x.u));
    d.dials.forEach(x => { if (x && x.u && !seen.has(x.u)){ dials.push(x); seen.add(x.u); } });
    save('kb.dials', dials);
  }
  if (Array.isArray(d.history)){
    const map = new Map();
    history.concat(d.history).forEach(h => { if (h && h.u){ const p = map.get(h.u); if (!p || (h.ts||0) > (p.ts||0)) map.set(h.u, h); } });
    history = [...map.values()].sort((a,b) => (a.ts||0) - (b.ts||0)).slice(-1500);
    save('kb.history', history);
  }
  if (d.settings && typeof d.settings === 'object'){
    ['engine','restore','adblock','homepage'].forEach(k => { if (d.settings[k] !== undefined) settings[k] = d.settings[k]; });
  }
  if (d.appearance && typeof d.appearance === 'object'){
    ['mode','accent','wallpaper','density','fs','caps','radius','avRound','motion','bgCol','lineCol','textCol']
      .forEach(k => { if (d.appearance[k] !== undefined) settings[k] = d.appearance[k]; });
  }
  if (d.hud && typeof d.hud === 'object'){
    if (Array.isArray(d.hud.widgets)) settings.hud = d.hud.widgets;
    if (d.hud.layout && typeof d.hud.layout === 'object') settings.hudLayout = d.hud.layout;
    if (d.hud.style && typeof d.hud.style === 'object') settings.hudStyle = d.hud.style;
    if (d.hud.row) settings.hudRow = d.hud.row;
    if (d.hud.loc !== undefined) settings.hudLoc = d.hud.loc;
    if (Array.isArray(d.hud.markets)) settings.markets = d.hud.markets;
    if (typeof d.hud.notes === 'string') settings.notes = d.hud.notes;
  }
  if (Array.isArray(d.readingList)){
    const seen = new Set(readingList.map(x => x.u));
    d.readingList.forEach(x => { if (x && x.u && !seen.has(x.u)){ readingList.push(x); seen.add(x.u); } });
    save('kb.reading', readingList);
  }
  saveSettings();
}

let pulling = false;
async function pullSync(){
  if (!account) return;
  pulling = true;
  try {
    const j = await kbApi('/api/sync');
    mergeIn(j.data);
    syncVer = j.ver || 0; save('kb.syncver', syncVer);
    applyTheme(); renderStart(); renderOmni(); renderBm();
    document.body.classList.toggle('bmbar-on', !!settings.bmbar); renderBmBar();
    bridge.send('adblock-set', { on: settings.adblock !== false });
    setSyncLine('Synced');
  } catch (e) { setSyncLine('Sync failed — ' + e.message); }
  finally { pulling = false; }
}
let pushT = null, pushing = false;
function schedulePush(){
  if (!account || pulling) return;
  clearTimeout(pushT);
  pushT = setTimeout(doPush, 1200);
}
async function doPush(){
  if (!account || pushing) return;
  pushing = true;
  try {
    const j = await kbApi('/api/sync', { method: 'PUT', body: { data: collectData() } });
    syncVer = j.ver || syncVer; save('kb.syncver', syncVer);
    setSyncLine('Synced');
  } catch (e) { setSyncLine('Sync failed — ' + e.message); }
  finally { pushing = false; }
}
/* every save() of a synced key schedules a push */
window.kbOnSave = k => { if (account && /^kb\.(bookmarks|history|dials|settings|reading)$/.test(k)) schedulePush(); };

function setSyncLine(t){ const el = $('#syncLine'); if (el) el.textContent = t + ' · v' + syncVer; }

/* ---- in-app updates: compare this build to the latest GitHub release ---- */
const REPO = 'vapesnuseu-cmyk/konekt-browser';
const RELEASES_URL = 'https://github.com/' + REPO + '/releases/latest';
function verNums(v){ return String(v || '').replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0); }
function newer(a, b){ const A = verNums(a), B = verNums(b); for (let i = 0; i < 3; i++){ if ((A[i]||0) > (B[i]||0)) return true; if ((A[i]||0) < (B[i]||0)) return false; } return false; }
async function checkUpdates(){
  const line = $('#updLine'); if (line){ line.className = 'set-note'; line.textContent = 'Checking…'; }
  let cur = '0.0.0';
  try { cur = (await bridge.info()).version || '0.0.0'; } catch {}
  try {
    const r = await fetch('https://api.github.com/repos/' + REPO + '/releases/latest', { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const latest = j.tag_name || j.name || '';
    if (!line) return;
    if (newer(latest, cur)){
      const info = await bridge.info().catch(()=>({}));
      line.className = 'set-note';
      line.innerHTML = 'Update available: <b>' + esc(latest) + '</b> (you have ' + esc(cur) + '). '
        + (info.isPackaged ? '<a href="#" id="updNow" style="color:var(--accent)">Update now</a> · ' : '')
        + '<a href="#" id="updGet" style="color:var(--dim)">open releases</a>';
      const now = $('#updNow');
      if (now) now.onclick = ev => { ev.preventDefault();
        if (!confirm('Download and install KONEKT Browser ' + latest + '? The app will restart to finish.')) return;
        line.innerHTML = 'Downloading update… <b id="updPct">0%</b>';
        bridge.send('self-update', { url: 'https://github.com/' + REPO + '/releases/latest/download/KONEKT-Browser-win-x64.zip' });
      };
      const g = $('#updGet'); if (g) g.onclick = ev => { ev.preventDefault(); newTab(RELEASES_URL); $('#shade').classList.remove('open'); };
    } else {
      line.className = 'set-note'; line.textContent = 'You’re on the latest version (' + esc(cur) + ').';
    }
  } catch (e) {
    if (line){ line.className = 'set-note'; line.innerHTML = 'Couldn’t check (' + esc(e.message) + '). <a href="#" id="updOpen" style="color:var(--accent)">Open releases</a>'; const o = $('#updOpen'); if (o) o.onclick = ev => { ev.preventDefault(); newTab(RELEASES_URL); }; }
  }
}

/* auto-check for an update on launch; prompt, then self-update on yes */
async function autoUpdateCheck(){
  try {
    const info = await bridge.info().catch(()=>({}));
    if (!info.isPackaged) return;                 // only the portable build self-updates
    const cur = info.version || '0.0.0';
    const r = await fetch('https://api.github.com/repos/' + REPO + '/releases/latest', { headers:{ Accept:'application/vnd.github+json' } });
    if (!r.ok) return;
    const j = await r.json(); const latest = j.tag_name || j.name || '';
    if (newer(latest, cur) && confirm('KONEKT Browser ' + latest + ' is available (you have ' + cur + ').\n\nUpdate now? The app will download it and restart to finish.')){
      toast('Downloading update ' + latest + '…');
      bridge.send('self-update', { url: 'https://github.com/' + REPO + '/releases/latest/download/KONEKT-Browser-win-x64.zip' });
    }
  } catch {}
}

/* ---- account button + modal ---- */
function acctInitial(){ return account ? (account.name || account.handle || '?').trim().charAt(0).toUpperCase() : ''; }
function renderAcctButton(){
  const b = $('#sAcct');
  b.classList.toggle('signed', !!account);
  b.innerHTML = account
    ? '<span class="acc-ini">' + esc(acctInitial()) + '</span><span class="acc-dot"></span>'
    : ic('user', 17);
  b.title = account ? ('@' + account.handle) : 'Account';
}
function openAccount(){ $('#acctShade').classList.add('open'); renderAccount(); }
function closeAccount(){ $('#acctShade').classList.remove('open'); }
function renderAccount(){
  $('#acctLogo').innerHTML = logoLong(22);
  if (account){
    $('#acctBody').innerHTML =
      '<div class="acc-tag">Account</div>'
      + '<div class="acc-me"><div class="who"><div class="av">' + esc(acctInitial()) + '</div>'
        + '<div><div class="nm">' + esc(account.name || account.handle) + '</div>'
        + '<div class="hd">@' + esc(account.handle) + '</div></div></div>'
      + '<div class="syncline" id="syncLine">Synced · v' + syncVer + '</div>'
      + '<div class="acc-row"><button id="acctSync">Sync now</button>'
        + '<button class="danger" id="acctOut">Sign out</button></div></div>';
    $('#acctSync').onclick = async () => { setSyncLine('Syncing…'); await doPush(); await pullSync(); };
    $('#acctOut').onclick = () => {
      account = null; save('kb.account', null);
      renderAcctButton(); renderAccount(); toast('Signed out');
    };
    return;
  }
  const sub = t => '<button class="auth-sub'+(authTab===t?' on':'')+'" data-authtab="'+t+'">'+(t==='login'?'Sign in':'Create account')+'</button>';
  const create = authTab === 'create';
  $('#acctBody').innerHTML =
    '<div class="acc-tag">Your KONEKT Browser account</div>'
    + '<div class="auth-tabs">' + sub('login') + sub('create') + '</div>'
    + '<div class="auth-form">'
      + '<input id="auHandle" placeholder="Handle" autocomplete="off" spellcheck="false" maxlength="20">'
      + (create ? '<input id="auName" placeholder="Display name (optional)" autocomplete="off" maxlength="40">' : '')
      + '<input id="auPass" type="password" placeholder="Password" maxlength="80">'
      + '<div class="auth-msg" id="auMsg">' + (create ? 'Handles are 3–20 chars: a–z, 0–9, underscore.' : '') + '</div>'
      + '<button class="auth-go" id="auGo">' + (create ? 'Create account' : 'Sign in') + '</button>'
    + '</div>';
  $$('[data-authtab]').forEach(el => el.onclick = () => { authTab = el.dataset.authtab; renderAccount(); });
  const go = $('#auGo'), msg = $('#auMsg');
  const submit = async () => {
    const handle = ($('#auHandle').value || '').trim().toLowerCase().replace(/^@/, '');
    const password = $('#auPass').value || '';
    const name = create && $('#auName') ? ($('#auName').value || '').trim() : '';
    if (!handle || !password){ msg.className = 'auth-msg err'; msg.textContent = 'Handle and password required'; return; }
    go.disabled = true; msg.className = 'auth-msg'; msg.textContent = create ? 'Creating…' : 'Signing in…';
    try {
      const j = await kbApi('/api/auth', { method: 'POST', body: { action: create ? 'register' : 'login', handle, password, name } });
      account = { handle: j.user.handle, name: j.user.name, token: j.token };
      save('kb.account', account);
      msg.className = 'auth-msg ok'; msg.textContent = 'Welcome, @' + account.handle;
      renderAcctButton();
      await pullSync();          // merge server → local
      await doPush();            // and push the merged set back
      renderAccount();
      toast('Signed in as @' + account.handle);
    } catch (e) {
      go.disabled = false; msg.className = 'auth-msg err'; msg.textContent = e.message;
    }
  };
  go.onclick = submit;
  $('#auPass').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

    const mk = (ws, ti) => { const t = newTab(START, true); t.ws = ws; t.title = ti; return t; };
    mk('work', 'Wikipedia'); mk('work', 'Hacker News'); mk('play', 'GitHub');
    activate(wsTabs('main')[0].id); renderTabs();
    if (open === 'work'){ switchWs('work'); } else { openWsPop(); }
    return { workspaces: wsAll().length, mainTabs: wsTabs('main').length, workTabs: wsTabs('work').length, activeWs: wsActiveId(), pop: !!$('#wsPop') }; },
  smokeSplit(){ settings.mode = 'dark'; applyTheme(); document.body.classList.remove('bmbar-on'); splitId = null;
    settings.workspaces = [{id:'main',name:'Main',color:'#a970ff'}]; wsSetActive('main');
    const a = AT(); tabs.filter(t => t.id !== a.id).forEach(t => { if (t.wv) t.wv.remove(); tabs.splice(tabs.indexOf(t), 1); });
    a.ws = 'main'; navigate(a, 'https://example.com');
    const b = newTab('https://en.wikipedia.org/wiki/Web_browser', true); b.ws = 'main';
    activate(a.id); return { tabs: tabs.length }; },
  smokeSplitGo(){ const a = AT(); const p = wsTabs().find(t => t.id !== a.id && t.wv); if (p) setSplit(p.id);
    return { split: $('#stage').classList.contains('split'), on: document.querySelectorAll('webview.wv.on').length,
             onr: document.querySelectorAll('webview.wv.on-r').length, div: $('#splitDiv').style.display }; },
  smokeSettingsAppearance(){ openSettings(); },
  smokeAccount(){ openAccount(); },
  smokeSettings(){ openSettings(); },
  appearanceState(){ return { mode: settings.mode, accent: settings.accent, wallpaper: settings.wallpaper, density: settings.density, hasAccount: !!account }; },
  smokeNav(url){ navigate(AT(), url); },
  smokeState(){
    const t = AT();
