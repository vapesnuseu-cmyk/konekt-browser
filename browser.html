/* ================================================================
   ACCOUNTS + SYNC — the browser's own KONEKT account. Stores your
   bookmarks, history, speed-dials, settings and appearance on the
   server so a second device signs in and sees the same thing. The
   backend is the konekt-browser Vercel deployment (same design and
   Redis as konekt-tawny); auth is a bearer token kept locally.
   ================================================================ */
const API_BASE = 'https://konekt-browser.vercel.app';
let account = load('kb.account', null);      // { handle, name, token }
let syncVer = load('kb.syncver', 0);
let authTab = 'login';

async function kbApi(path, opts){
  opts = opts || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (account && account.token) headers['Authorization'] = 'Bearer ' + account.token;
  const r = await fetch(API_BASE + path, {
    method: opts.method || 'GET', headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

/* ---- the blob we sync ---- */
function collectData(){
  return {
    bookmarks: bookmarks,
    history: history.slice(-1200),
    dials: dials,
    settings: { engine: settings.engine, restore: settings.restore, adblock: settings.adblock, homepage: settings.homepage },
    appearance: { mode: settings.mode, accent: settings.accent, wallpaper: settings.wallpaper, density: settings.density,
                  fs: settings.fs, caps: settings.caps, radius: settings.radius, avRound: settings.avRound,
                  motion: settings.motion, bgCol: settings.bgCol, lineCol: settings.lineCol, textCol: settings.textCol }
  };
}
function mergeIn(d){
  if (!d || typeof d !== 'object') return;
  if (Array.isArray(d.bookmarks)){
    const seen = new Set(bookmarks.map(b => b.u));
    d.bookmarks.forEach(b => { if (b && b.u && !seen.has(b.u)){ bookmarks.push(b); seen.add(b.u); } });
    save('kb.bookmarks', bookmarks);
  }
  if (Array.isArray(d.dials)){
    const seen = new Set(dials.map(x => x.u));
    d.dials.forEach(x => { if (x && x.u && !seen.has(x.u)){ dials.push(x); seen.add(x.u); } });
    save('kb.dials', dials);
  }
  if (Array.isArray(d.history)){
    const map = new Map();
    history.concat(d.history).forEach(h => { if (h && h.u){ const p = map.get(h.u); if (!p || (h.ts||0) > (p.ts||0)) map.set(h.u, h); } });
    history = [...map.values()].sort((a,b) => (a.ts||0) - (b.ts||0)).slice(-1500);
    save('kb.history', history);
  }
  if (d.settings && typeof d.settings === 'object'){
    ['engine','restore','adblock','homepage'].forEach(k => { if (d.settings[k] !== undefined) settings[k] = d.settings[k]; });
  }
  if (d.appearance && typeof d.appearance === 'object'){
    ['mode','accent','wallpaper','density','fs','caps','radius','avRound','motion','bgCol','lineCol','textCol']
      .forEach(k => { if (d.appearance[k] !== undefined) settings[k] = d.appearance[k]; });
  }
  saveSettings();
}

let pulling = false;
async function pullSync(){
  if (!account) return;
  pulling = true;
  try {
    const j = await kbApi('/api/sync');
    mergeIn(j.data);
    syncVer = j.ver || 0; save('kb.syncver', syncVer);
    applyTheme(); renderStart(); renderOmni(); renderBm();
    bridge.send('adblock-set', { on: settings.adblock !== false });
    setSyncLine('Synced');
  } catch (e) { setSyncLine('Sync failed — ' + e.message); }
  finally { pulling = false; }
}
let pushT = null, pushing = false;
function schedulePush(){
  if (!account || pulling) return;
  clearTimeout(pushT);
  pushT = setTimeout(doPush, 1200);
}
async function doPush(){
  if (!account || pushing) return;
  pushing = true;
  try {
    const j = await kbApi('/api/sync', { method: 'PUT', body: { data: collectData() } });
    syncVer = j.ver || syncVer; save('kb.syncver', syncVer);
    setSyncLine('Synced');
  } catch (e) { setSyncLine('Sync failed — ' + e.message); }
  finally { pushing = false; }
}
/* every save() of a synced key schedules a push */
window.kbOnSave = k => { if (account && /^kb\.(bookmarks|history|dials|settings)$/.test(k)) schedulePush(); };

function setSyncLine(t){ const el = $('#syncLine'); if (el) el.textContent = t + ' · v' + syncVer; }

/* ---- in-app updates: compare this build to the latest GitHub release ---- */
const REPO = 'vapesnuseu-cmyk/konekt-browser';
const RELEASES_URL = 'https://github.com/' + REPO + '/releases/latest';
function verNums(v){ return String(v || '').replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0); }
function newer(a, b){ const A = verNums(a), B = verNums(b); for (let i = 0; i < 3; i++){ if ((A[i]||0) > (B[i]||0)) return true; if ((A[i]||0) < (B[i]||0)) return false; } return false; }
async function checkUpdates(){
  const line = $('#updLine'); if (line){ line.className = 'set-note'; line.textContent = 'Checking…'; }
  let cur = '0.0.0';
  try { cur = (await bridge.info()).version || '0.0.0'; } catch {}
  try {
    const r = await fetch('https://api.github.com/repos/' + REPO + '/releases/latest', { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const latest = j.tag_name || j.name || '';
    if (!line) return;
    if (newer(latest, cur)){
      line.className = 'set-note';
      line.innerHTML = 'Update available: <b>' + esc(latest) + '</b> (you have ' + esc(cur) + '). '
        + '<a href="#" id="updGet" style="color:var(--accent)">Get it</a>';
      const g = $('#updGet'); if (g) g.onclick = ev => { ev.preventDefault(); newTab(RELEASES_URL); $('#shade').classList.remove('open'); };
    } else {
      line.className = 'set-note'; line.textContent = 'You’re on the latest version (' + esc(cur) + ').';
    }
  } catch (e) {
    if (line){ line.className = 'set-note'; line.innerHTML = 'Couldn’t check (' + esc(e.message) + '). <a href="#" id="updOpen" style="color:var(--accent)">Open releases</a>'; const o = $('#updOpen'); if (o) o.onclick = ev => { ev.preventDefault(); newTab(RELEASES_URL); }; }
  }
}

/* ---- account button + modal ---- */
function acctInitial(){ return account ? (account.name || account.handle || '?').trim().charAt(0).toUpperCase() : ''; }
function renderAcctButton(){
  const b = $('#sAcct');
  b.classList.toggle('signed', !!account);
  b.innerHTML = account
    ? '<span class="acc-ini">' + esc(acctInitial()) + '</span><span class="acc-dot"></span>'
    : ic('user', 17);
  b.title = account ? ('@' + account.handle) : 'Account';
}
function openAccount(){ $('#acctShade').classList.add('open'); renderAccount(); }
function closeAccount(){ $('#acctShade').classList.remove('open'); }
function renderAccount(){
  $('#acctLogo').innerHTML = logoLong(22);
  if (account){
    $('#acctBody').innerHTML =
      '<div class="acc-tag">Account</div>'
      + '<div class="acc-me"><div class="who"><div class="av">' + esc(acctInitial()) + '</div>'
        + '<div><div class="nm">' + esc(account.name || account.handle) + '</div>'
        + '<div class="hd">@' + esc(account.handle) + '</div></div></div>'
      + '<div class="syncline" id="syncLine">Synced · v' + syncVer + '</div>'
      + '<div class="acc-row"><button id="acctSync">Sync now</button>'
        + '<button class="danger" id="acctOut">Sign out</button></div></div>';
    $('#acctSync').onclick = async () => { setSyncLine('Syncing…'); await doPush(); await pullSync(); };
    $('#acctOut').onclick = () => {
      account = null; save('kb.account', null);
      renderAcctButton(); renderAccount(); toast('Signed out');
    };
    return;
  }
  const sub = t => '<button class="auth-sub'+(authTab===t?' on':'')+'" data-authtab="'+t+'">'+(t==='login'?'Sign in':'Create account')+'</button>';
  const create = authTab === 'create';
  $('#acctBody').innerHTML =
    '<div class="acc-tag">Your KONEKT Browser account</div>'
    + '<div class="auth-tabs">' + sub('login') + sub('create') + '</div>'
    + '<div class="auth-form">'
      + '<input id="auHandle" placeholder="Handle" autocomplete="off" spellcheck="false" maxlength="20">'
      + (create ? '<input id="auName" placeholder="Display name (optional)" autocomplete="off" maxlength="40">' : '')
      + '<input id="auPass" type="password" placeholder="Password" maxlength="80">'
      + '<div class="auth-msg" id="auMsg">' + (create ? 'Handles are 3–20 chars: a–z, 0–9, underscore.' : '') + '</div>'
      + '<button class="auth-go" id="auGo">' + (create ? 'Create account' : 'Sign in') + '</button>'
    + '</div>';
  $$('[data-authtab]').forEach(el => el.onclick = () => { authTab = el.dataset.authtab; renderAccount(); });
  const go = $('#auGo'), msg = $('#auMsg');
  const submit = async () => {
    const handle = ($('#auHandle').value || '').trim().toLowerCase().replace(/^@/, '');
    const password = $('#auPass').value || '';
    const name = create && $('#auName') ? ($('#auName').value || '').trim() : '';
    if (!handle || !password){ msg.className = 'auth-msg err'; msg.textContent = 'Handle and password required'; return; }
    go.disabled = true; msg.className = 'auth-msg'; msg.textContent = create ? 'Creating…' : 'Signing in…';
    try {
      const j = await kbApi('/api/auth', { method: 'POST', body: { action: create ? 'register' : 'login', handle, password, name } });
      account = { handle: j.user.handle, name: j.user.name, token: j.token };
      save('kb.account', account);
      msg.className = 'auth-msg ok'; msg.textContent = 'Welcome, @' + account.handle;
      renderAcctButton();
      await pullSync();          // merge server → local
      await doPush();            // and push the merged set back
      renderAccount();
      toast('Signed in as @' + account.handle);
    } catch (e) {
      go.disabled = false; msg.className = 'auth-msg err'; msg.textContent = e.message;
    }
  };
  go.onclick = submit;
  $('#auPass').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}
